[project]
name = "filing-figures"
version = "0.1.0"
description = "Pull six financial figures out of SEC 10-K filings with a small fine-tuned LLM, scored against XBRL"
readme = "README.md"
authors = [
    { name = "Nathan Kyryk", email = "nathankyryk@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "httpx>=0.28.1",
    "huggingface-hub>=2.3.0",
    "lxml>=6.1.3",
    "openai>=3.41.0",
    "pandas>=3.1.0",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "tokenizers>=0.23.3",
    "typer>=0.27.3",
]

[project.scripts]
figures = "filing_figures.cli:app"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
extend-exclude = ["data", "outputs", "weights"]

[tool.ruff.lint.flake8-bugbear]
# Typer declares CLI options as default values
extend-immutable-calls = ["typer.Option", "typer.Argument"]
